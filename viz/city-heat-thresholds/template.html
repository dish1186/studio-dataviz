<title>City Heat Thresholds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#15212b; --ink-2:#4f5d68; --ink-3:#8795a0; --line:#d9e0e5;
  --heat:#d8452b; --er:#5b3fb5; --air:#2f7d6b; --epa:#c0392b;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --panel:#17212a; --ink:#e8eef2; --ink-2:#a9b6c0; --ink-3:#6f7d88; --line:#2a3743;
  --heat:#ff6a4d; --er:#a48cff; --air:#5fc9ac; --epa:#ff7a6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --panel:#17212a; --ink:#e8eef2; --ink-2:#a9b6c0; --ink-3:#6f7d88; --line:#2a3743;
  --heat:#ff6a4d; --er:#a48cff; --air:#5fc9ac; --epa:#ff7a6b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:780px;margin:0 auto;padding-inline:20px;padding-block:20px 36px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,42px);line-height:1.02;margin:0;letter-spacing:-.01em}
.lede{color:var(--ink-2);max-width:62ch;margin:6px 0 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.gctl{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.rowl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lbl{font-size:12px;color:var(--ink-3);min-width:3.5em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.gtab{font:inherit;font-size:13px;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.gtab[aria-pressed=true]{border-color:var(--ink);color:var(--ink);background:var(--bg);font-weight:500}
.gtab:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:13.5px;border:0;background:transparent;color:var(--ink-2);padding:6px 12px;font-weight:500;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.seg button:focus-visible,.gtab:focus-visible{outline:2px solid var(--er);outline-offset:2px}
.gread{font-size:15px;line-height:1.6;margin:8px 0 0;max-width:75ch}
.gread b{font-weight:500}
.muted{color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;vertical-align:-2px;margin-right:6px}
svg text{font-family:var(--body)}
.foot{font-size:12px;color:var(--ink-3);max-width:90ch;margin:0}
.foot b{color:var(--ink-2);font-weight:500}
</style>
<div class="wrap">
  <header>
    <div class="eyebrow">Heat and air · what are our own thresholds for action?</div>
    <h1>City heat thresholds</h1>
    <p class="lede">Three layers for seven cities. When searches for “air conditioner” take off; when heat-related ER visits climb; and how often bad air brings searches for an air purifier.</p>
  </header>
  <section class="panel">
    <div class="gctl">
      <div class="rowl"><span class="lbl">Layer</span><div class="seg" id="layers" role="group" aria-label="Layer"></div></div>
      <div class="rowl"><span class="lbl">City</span><div class="chips" id="gcities"></div></div>
      <div class="rowl"><span class="lbl">Years</span><div class="chips" id="gperiods"></div></div>
    </div>
    <svg id="stage" viewBox="0 0 640 500" width="100%" role="img" aria-label="Vertical scale with the selected city's threshold for the selected layer"></svg>
    <div class="legend" id="legend"></div>
    <p class="gread" id="gread"></p>
  </section>
  <p class="foot" id="foot"></p>
</div>
<script>
const G=__DATA__;
const ORDER=["eugene","bakersfield","boston","detroit","phoenix","sandiego","sanfrancisco"];
const LAYERS={search:"Heat · AC searches",er:"Heat · ER visits",air:"Air · purifier searches"};
const GP={pre:"Before 2026",y26:"2026 so far",all:"All years",cmp:"Compare"};
const gauge={city:"eugene",per:"pre",layer:"search"};
const R=Math.round,$=id=>document.getElementById(id);
const spread=(L,gap)=>{L.sort((a,b)=>a.y-b.y);for(let i=1;i<L.length;i++)if(L[i].y-L[i-1].y<gap)L[i].y=L[i-1].y+gap;return L};
function tabs(){
  const mk=(el,obj,key,label,dis)=>{el.innerHTML="";for(const k in obj){const b=document.createElement("button");b.type="button";b.className=el.id=="layers"?"":"gtab";b.textContent=label(obj[k],k);
    b.setAttribute("aria-pressed",gauge[key]===k);if(dis&&dis(k))b.disabled=true;b.onclick=()=>{gauge[key]=k;tabs();draw()};el.appendChild(b)}};
  mk($("layers"),LAYERS,"layer",v=>v);
  const C={};ORDER.forEach(k=>C[k]=G[k]);mk($("gcities"),C,"city",v=>v.n);
  if(gauge.layer=="air")gauge.per="all";
  mk($("gperiods"),GP,"per",v=>v,k=>gauge.layer=="air"&&k!="all");
}
function col(x,label,sub,live,TOP,BOT){let s=`<text x="${x}" y="484" text-anchor="middle" font-size="14" font-weight="${live?500:400}" fill="${live?"var(--ink)":"var(--ink-2)"}">${label}</text>`;
  s+=`<line x1="${x}" y1="${TOP}" x2="${x}" y2="${BOT}" stroke="${live?"var(--ink-3)":"var(--line)"}" stroke-width="2"${live?"":' stroke-dasharray="4 5"'}/>`;
  if(!live)s+=`<text x="${x-10}" y="${(TOP+BOT)/2}" text-anchor="middle" transform="rotate(-90 ${x-10} ${(TOP+BOT)/2})" font-size="12" fill="var(--ink-3)">${sub}</text>`;return s}
function heatSVG(){
  const lay=gauge.layer,city=gauge.city,per=gauge.per,key=per=="cmp"?"pre":per,v=G[city],col1=lay=="er"?"var(--er)":"var(--heat)";
  const TOP=30,BOT=450,T0=30,T1=115,HX=330,y=t=>BOT-(Math.max(T0,Math.min(T1,t))-T0)/(T1-T0)*(BOT-TOP);
  let s=col(70,"Air","switch to the air layer",false,TOP,BOT)+col(HX,lay=="er"?"Heat · ER visits":"Heat · AC searches","",true,TOP,BOT)+col(590,"Pollen","pollen, coming soon",false,TOP,BOT);
  for(let t=T0;t<=T1;t+=5){s+=`<line x1="${HX-4}" y1="${y(t)}" x2="${HX+4}" y2="${y(t)}" stroke="var(--ink-3)"/>`;if(t%10===0)s+=`<text x="${HX+10}" y="${y(t)+4}" font-size="11" fill="var(--ink-3)">${t}°</text>`}
  const L1=lay,others=ORDER.filter(k=>k!==city&&G[k][L1][key].s!=null).map(k=>({k,t:G[k][L1][key].s}));
  spread(others.map(o=>({...o,y:y(o.t)+4})),15).forEach(o=>{const Y=y(o.t);s+=`<circle cx="${HX}" cy="${Y}" r="4.5" fill="var(--ink-3)" stroke="var(--panel)" stroke-width="2"/><line x1="${HX+6}" y1="${Y}" x2="${HX+44}" y2="${o.y-4}" stroke="var(--line)"/><text x="${HX+48}" y="${o.y}" font-size="11" fill="var(--ink-2)">${G[o.k].a} ${R(o.t)}°${lay=="er"&&G[o.k].region=="Region 9"?"*":""}</text>`});
  s+=`<line x1="${HX-26}" y1="${y(v.sum)}" x2="${HX+26}" y2="${y(v.sum)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="3 2"/>`;
  const d=v[L1];let Lb=[],read;
  if(lay=="er"&&per!="cmp"&&v.search[key].s!=null){const g=v.search[key].s;s+=`<circle cx="${HX}" cy="${y(g)}" r="7" fill="none" stroke="var(--heat)" stroke-width="1.5" stroke-dasharray="2 2"/>`;Lb.push({y:y(g)+4,ty:y(g),t:`AC searches · ${R(g)}°`,w:400})}
  if(per=="cmp"){const a=d.pre,b=d.y26;
    if(a.ci)s+=`<rect x="${HX-22}" y="${y(a.ci[1])}" width="8" height="${y(a.ci[0])-y(a.ci[1])}" rx="4" fill="${col1}" opacity=".35"/>`;
    if(b.ci)s+=`<rect x="${HX+14}" y="${y(b.ci[1])}" width="8" height="${y(b.ci[0])-y(b.ci[1])}" rx="4" fill="none" stroke="${col1}" stroke-width="1.5" stroke-dasharray="3 2"/>`;
    if(a.s!=null)s+=`<circle cx="${HX}" cy="${y(a.s)}" r="9" fill="${col1}" stroke="var(--panel)" stroke-width="2"/>`;
    if(b.s!=null)s+=`<circle cx="${HX}" cy="${y(b.s)}" r="8" fill="var(--panel)" stroke="${col1}" stroke-width="2.5"/>`;
    Lb.push({y:y(a.s)+4,ty:y(a.s),t:`before 2026 · ${R(a.s)}°`,w:500},{y:y(b.s)+4,ty:y(b.s),t:`2026 so far · ${R(b.s)}°`,w:500},{y:y(v.sum)+4,ty:y(v.sum),t:`typical summer · ${R(v.sum)}°`,w:400});
    const dd=R(b.s-a.s);read=`${v.n}: ${lay=="er"?"heat-related ER visits climb":"searchers reach for AC"} at <b>${R(a.s)}°F</b> before 2026 and <b>${R(b.s)}°F</b> in 2026 so far (${dd===0?"no change":Math.abs(dd)+"° "+(dd<0?"lower":"higher")}). <span class="muted">2026 is one partial year: treat it as a hint, not a change.</span>`;
  }else{const a=d[key];
    if(a.ci)s+=`<rect x="${HX-8}" y="${y(a.ci[1])}" width="16" height="${y(a.ci[0])-y(a.ci[1])}" rx="8" fill="${col1}" opacity=".25"/>`;
    if(lay=="search"&&a.st!=null){s+=`<circle cx="${HX}" cy="${y(a.st)}" r="6" fill="var(--panel)" stroke="var(--heat)" stroke-width="2.5"/>`;Lb.push({y:y(a.st)+4,ty:y(a.st),t:`start looking · ${R(a.st)}°`,w:400})}
    if(a.s!=null){s+=`<circle cx="${HX}" cy="${y(a.s)}" r="9" fill="${col1}" stroke="var(--panel)" stroke-width="2"/>`;Lb.push({y:y(a.s)+5,ty:y(a.s),t:`${v.n} ${lay=="er"?"ER visits climb":"searchers"} · ${R(a.s)}°F`,w:500})}
    Lb.push({y:y(v.sum)+4,ty:y(v.sum),t:`typical summer · ${R(v.sum)}°`,w:400});
    const gap=R(v.sum-a.s);
    if(lay=="search")read=`${a.st!=null?`${v.n} starts looking for air conditioners around <b>${R(a.st)}°F</b>, and its`:`${v.n} shows no clear point where searching starts (searches do not flatten out in cooler weeks); its`} searchers reach for AC at <b>${R(a.s)}°F</b>${a.ci?` (likely ${R(a.ci[0])}–${R(a.ci[1])}°)`:""}, ${Math.abs(gap)}° ${gap>=0?"below":"above"} a typical ${v.n} summer high. <span class="muted">${GP[per]}${per=="y26"?"; one partial year, wide ranges":""}.</span>`;
    else{const g=v.search[key].s,dg=R(a.s-g);read=`In ${v.n}, heat-related ER visits climb at <b>${R(a.s)}°F</b>${a.ci?` (likely ${R(a.ci[0])}–${R(a.ci[1])}°)`:""}: ${Math.abs(gap)}° ${gap>=0?"below":"above"} a typical summer high, and ${Math.abs(dg)}° ${dg>=0?"above":"below"} where searchers reach for AC (${R(g)}°F). <span class="muted">${v.region=="Region 9"?`ER data cover all of HHS Region 9 (AZ, CA, HI, NV), shared with ${ORDER.filter(k=>k!==city&&G[k].region=="Region 9").map(k=>G[k].n).join(", ")}, so this mostly reflects inland heat${city=="sanfrancisco"||city=="sandiego"?"; read it as regional, not local":""}.`:`ER data cover HHS ${v.region}.`}</span>`}}
  spread(Lb,17).forEach(l=>{s+=`<line x1="${HX-30}" y1="${l.ty}" x2="${HX-46}" y2="${l.y-4}" stroke="var(--line)"/><text x="${HX-50}" y="${l.y}" text-anchor="end" font-size="${l.w===500?13:12}" font-weight="${l.w}" fill="${l.w===500?"var(--ink)":"var(--ink-2)"}">${l.t}</text>`});
  return {svg:s,read};
}
function airSVG(){
  const city=gauge.city,v=G[city],A=v.air;
  const TOP=30,BOT=450,P0=2,P1=150,AX=330,y=p=>BOT-(Math.log(Math.max(P0,Math.min(P1,p)))-Math.log(P0))/(Math.log(P1)-Math.log(P0))*(BOT-TOP);
  let s=col(70,"Heat","switch to a heat layer",false,TOP,BOT)+col(AX,"Air · purifier searches","",true,TOP,BOT)+col(590,"Pollen","pollen, coming soon",false,TOP,BOT);
  [2,5,10,20,35.5,55.5,100,150].forEach(p=>{s+=`<line x1="${AX-4}" y1="${y(p)}" x2="${AX+4}" y2="${y(p)}" stroke="var(--ink-3)"/><text x="${AX+10}" y="${y(p)+4}" font-size="11" fill="var(--ink-3)">${p}</text>`});
  s+=`<text x="${AX+10}" y="${TOP-12}" font-size="11" fill="var(--ink-3)">µg/m³ PM2.5, worst day of the week</text>`;
  A.bands.forEach(b=>{const yt=y(Math.min(b.hi,P1)),yb=y(Math.max(b.lo,P0)),sh=b.n?b.k/b.n:null;
    s+=`<rect x="${AX-12}" y="${yt+1}" width="24" height="${yb-yt-2}" rx="6" fill="var(--air)" opacity="${sh==null?0.05:0.12+0.75*sh}"/>`;
    s+=`<text x="${AX-20}" y="${(yt+yb)/2+4}" text-anchor="end" font-size="12" fill="${b.n?"var(--ink)":"var(--ink-3)"}">${b.n?`${R(100*b.k/b.n)}% of ${b.n} week${b.n==1?"":"s"}`:"no weeks"}</text>`});
  s+=`<line x1="${AX-60}" y1="${y(35.5)}" x2="${AX+60}" y2="${y(35.5)}" stroke="var(--epa)" stroke-width="1.5" stroke-dasharray="5 3"/><text x="${AX+64}" y="${y(35.5)-4}" font-size="11" fill="var(--epa)">EPA unhealthy for sensitive groups</text>`;
  s+=`<line x1="${AX-26}" y1="${y(v.typ_pm)}" x2="${AX+26}" y2="${y(v.typ_pm)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="3 2"/><text x="${AX+64}" y="${y(v.typ_pm)+4}" font-size="11" fill="var(--ink-2)">typical day · ${v.typ_pm}</text>`;
  s+=`<path d="M${AX+14} ${y(v.worst_pm_week)}l8 -5v10z" fill="var(--ink-2)"/><text x="${AX+64}" y="${y(v.worst_pm_week)+4}" font-size="11" fill="var(--ink-2)">worst week · ${v.worst_pm_week}</text>`;
  if(A.react!=null)s+=`<circle cx="${AX}" cy="${y(Math.max(A.react,P0))}" r="9" fill="var(--air)" stroke="var(--panel)" stroke-width="2"/>`;
  const others=ORDER.filter(k=>k!==city).map(k=>({k,r:G[k].air.react}));
  const L=others.map((o,i)=>({o,y:o.r!=null?y(Math.max(o.r,P0)):TOP+8+i*15}));
  spread(L,15).forEach(l=>s+=`<text x="${30}" y="${l.y+4}" font-size="11" fill="var(--ink-3)">${G[l.o.k].a} ${l.o.r!=null?"≥"+l.o.r:"–"}</text>`);
  s+=`<text x="30" y="${TOP-12}" font-size="11" fill="var(--ink-3)">other cities' reaction point</text>`;
  const bad=A.bands.filter(b=>b.lo>=35.5),bn=bad.reduce((a,b)=>a+b.n,0),bk=bad.reduce((a,b)=>a+b.k,0);
  const read=bn?`In ${v.n}, <b>${bk} of ${bn}</b> weeks with unhealthy air (a day at or above 35.5 µg/m³) brought a spike in air purifier searches, against ${R(100*A.bands[0].k/Math.max(1,A.bands[0].n))}% of clean weeks. ${A.react!=null?`More than half of weeks spike from <b>${A.react} µg/m³</b>.`:`Searches never spiked in more than half of any band's weeks.`} <span class="muted">2022–2026 together; ${bn<4?"very few bad-air weeks, so read with care; ":""}a spike = searches above the city's 75th percentile${A.spike_above==0?" (here: any searches at all)":""}.</span>`:`${v.n} had no week with unhealthy air in 2022–2026, so there is nothing to react to. <span class="muted">Its worst week peaked at ${v.worst_pm_week} µg/m³.</span>`;
  return {svg:s,read};
}
function legend(){
  if(gauge.layer=="air")return `<span><i><svg width="14" height="14"><rect width="14" height="14" rx="4" fill="var(--air)" opacity=".7"/></svg></i>darker = more weeks with a purifier spike</span><span><i><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="var(--air)"/></svg></i>reaction point (over half of weeks spike)</span><span><i><svg width="18" height="14"><line x1="1" y1="7" x2="17" y2="7" stroke="var(--epa)" stroke-width="2" stroke-dasharray="4 2"/></svg></i>EPA line</span><span><i><svg width="18" height="14"><line x1="1" y1="7" x2="17" y2="7" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="3 2"/></svg></i>typical day 2022–2026</span>`;
  const c=gauge.layer=="er"?"var(--er)":"var(--heat)";
  return `<span><i><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="${c}"/></svg></i>${gauge.layer=="er"?"ER visits climb":"searchers reach for AC"}, with likely range</span>${gauge.layer=="search"?`<span><i><svg width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="var(--heat)" stroke-width="2"/></svg></i>start looking</span>`:`<span><i><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--heat)" stroke-width="1.5" stroke-dasharray="2 2"/></svg></i>AC searches, for comparison</span>`}<span><i><svg width="18" height="14"><line x1="1" y1="7" x2="17" y2="7" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="3 2"/></svg></i>typical summer high (1991–2020)</span><span><i><svg width="14" height="14"><circle cx="7" cy="7" r="4" fill="var(--ink-3)"/></svg></i>other cities${gauge.layer=="er"?" (* = shared HHS Region 9)":""}</span>`;
}
function draw(){const o=gauge.layer=="air"?airSVG():heatSVG();$("stage").innerHTML=o.svg;$("gread").innerHTML=o.read;$("legend").innerHTML=legend()}
$("foot").innerHTML=`<b>Heat · AC searches.</b> The weekly high at which Google searches for “air conditioner” get halfway from a normal January–February week to their hottest-weeks level, with a 90% range from 1,000 resamples of 4-week blocks; “start looking” = where searches first rise off the winter level (Google Trends Steps 11–12). Eugene and Bakersfield (added): their winter searches are zero in most weeks, so the halfway point is taken on the search index itself and “start looking” on log2(1 + index); the same rule lands within 0–6° of the published values for the other five cities. <b>Heat · ER visits.</b> The same halfway rule on daily heat-related ER visits (per 100,000 ER visits, CDC Environmental Public Health Tracking, by HHS region) against the daily high: halfway from a January–February day to the hottest 10% of days, 90% range from 1,000 resamples of 28-day blocks. Region 9 is one series for Phoenix, San Diego, San Francisco and Bakersfield. <b>Air · purifier searches.</b> Weekly Google Trends “air purifier”, 2022–2026, each week placed by its worst day of PM2.5 (OpenAQ city mean); spike = above the city's 75th percentile of weeks (or any searches, where that is zero); bands follow EPA breakpoints; the reaction point is the first band (2+ weeks) where more than half of weeks spike. Weeks 22 Mar–28 Jun 2026 are left out (a national surge with no local air cause). Weekly highs: gridMET; typical summer high = June–August average, 1991–2020. 2026 runs January to September. Associations, not causes. MDE studio project, 2026.`;
tabs();draw();
</script>

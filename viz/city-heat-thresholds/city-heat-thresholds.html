    else{const g=v.search[key].s,dg=R(a.s-g);read=`In ${v.n}, heat-related ER visits climb at <b>${R(a.s)}\u00b0F</b>${a.ci?` (likely ${R(a.ci[0])}\u2013${R(a.ci[1])}\u00b0)`:""}: ${Math.abs(gap)}\u00b0 ${gap>=0?"below":"above"} a typical summer high, and ${Math.abs(dg)}\u00b0 ${dg>=0?"above":"below"} where searchers reach for AC (${R(g)}\u00b0F). <span class="muted">${v.region=="Region 9"?`ER data cover all of HHS Region 9 (AZ, CA, HI, NV), shared with ${ORDER.filter(k=>k!==city&&G[k].region=="Region 9").map(k=>G[k].n).join(", ")}, so this mostly reflects inland heat${city=="sanfrancisco"||city=="sandiego"?"; read it as regional, not local":""}.`:`ER data cover HHS ${v.region}.`}</span>`}}
  spread(Lb,17).forEach(l=>{s+=`<line x1="${HX-30}" y1="${l.ty}" x2="${HX-46}" y2="${l.y-4}" stroke="var(--line)"/><text x="${HX-50}" y="${l.y}" text-anchor="end" font-size="${l.w===500?13:12}" font-weight="${l.w}" fill="${l.w===500?"var(--ink)":"var(--ink-2)"}">${l.t}</text>`});

function airSVG(){

  const none=ORDER.filter(k=>k!==city&&G[k].air.gauge.s==null).map(k=>G[k].a);
  if(none.length)s+=`<text x="${AX+48}" y="${BOT+2}" font-size="11" fill="var(--ink-3)">no surge: ${none.join(", ")}</text>`;

  s+=`<path d="M${AX+14} ${y(v.worst_pm_week)}l8 -5v10z" fill="var(--ink-2)"/>`;
  const L=[{y:y(v.typ_pm)+4,ty:y(v.typ_pm),t:`typical day \u00b7 ${v.typ_pm}`,w:400},{y:y(v.worst_pm_week)+4,ty:y(v.worst_pm_week),t:`worst week \u00b7 ${R(v.worst_pm_week)}`,w:400}];
  if(g.s!=null){if(g.ci)s+=`<rect x="${AX-8}" y="${y(g.ci[1])}" width="16" height="${y(g.ci[0])-y(g.ci[1])}" rx="8" fill="var(--air)" opacity=".25"/>`;
    s+=`<circle cx="${AX}" cy="${y(g.s)}" r="9" fill="var(--air)" stroke="var(--panel)" stroke-width="2"/>`;L.push({y:y(g.s)+5,ty:y(g.s),t:`${v.n} purifier searches \u00b7 ${R(g.s)} \u00b5g/m\u00b3${g.ci?"":"?"}`,w:500})}

  const bad=A.bands.filter(b=>b.lo>=35.5),bn=bad.reduce((a,b)=>a+b.n,0),bk=bad.reduce((a,b)=>a+b.k,0),base=R(100*g.base);

  return {svg:s,read};

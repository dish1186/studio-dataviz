    else if(lay=="ice"){const g=v.search[key].s;read=a.s==null?`${v.n}'s ice cream searches never get halfway to their hottest-weeks level as weeks warm. <span class="muted">${GP[per]}.</span>`:`${v.n}'s ice cream searches ${a.st!=null?`start rising around <b>${R(a.st)}\u00b0F</b> and `:""}take off at <b>${R(a.s)}\u00b0F</b>${a.ci?` (likely ${R(a.ci[0])}\u2013${R(a.ci[1])}\u00b0)`:""}, ${Math.abs(gap)}\u00b0 ${gap>=0?"below":"above"} a typical summer high${g!=null?` and ${Math.abs(R(a.s-g))}\u00b0 ${a.s>=g?"above":"below"} where searchers reach for AC (${R(g)}\u00b0F)`:""}. <span class="muted">${GP[per]}. Ice cream also follows the calendar (summer, holidays), so part of this is season, not heat.</span>`}
    else{const g=v.search[key].s,dg=R(a.s-g);read=`In ${v.n}, heat-related ER visits climb at <b>${R(a.s)}\u00b0F</b>${a.ci?` (likely ${R(a.ci[0])}\u2013${R(a.ci[1])}\u00b0)`:""}: ${Math.abs(gap)}\u00b0 ${gap>=0?"below":"above"} a typical summer high, and ${Math.abs(dg)}\u00b0 ${dg>=0?"above":"below"} where searchers reach for AC (${R(g)}\u00b0F). <span class="muted">${v.region=="Region 9"?`ER data cover all of HHS Region 9 (AZ, CA, HI, NV), shared with ${ORDER.filter(k=>k!==city&&G[k].region=="Region 9").map(k=>G[k].n).join(", ")}, so this mostly reflects inland heat${city=="sanfrancisco"||city=="sandiego"?"; read it as regional, not local":""}.`:`ER data cover HHS ${v.region}.`}</span>`}}
  spread(Lb,17).forEach(l=>{s+=`<line x1="${HX-30}" y1="${l.ty}" x2="${HX-46}" y2="${l.y-4}" stroke="var(--line)"/><text x="${HX-50}" y="${l.y}" text-anchor="end" font-size="${l.w===500?13:12}" font-weight="${l.w}" fill="${l.w===500?"var(--ink)":"var(--ink-2)"}">${l.t}</text>`});
  return {svg:s,read};
}
function airSVG(){
  const city=gauge.city,v=G[city],A=v.air;
  const TOP=30,BOT=450,P0=2,P1=150,AX=330,y=p=>BOT-(Math.log(Math.max(P0,Math.min(P1,p)))-Math.log(P0))/(Math.log(P1)-Math.log(P0))*(BOT-TOP);
  let s=col(70,"Heat","switch to a heat layer",false,TOP,BOT)+col(AX,"Air \u00b7 purifier searches","",true,TOP,BOT)+col(590,"Pollen","pollen, coming soon",false,TOP,BOT);
  [2,5,10,20,35.5,55.5,100,150].forEach(p=>{s+=`<line x1="${AX-4}" y1="${y(p)}" x2="${AX+4}" y2="${y(p)}" stroke="var(--ink-3)"/><text x="${AX+10}" y="${y(p)+4}" font-size="11" fill="var(--ink-3)">${p}</text>`});
  s+=`<text x="${AX+10}" y="${TOP-12}" font-size="11" fill="var(--ink-3)">\u00b5g/m\u00b3 PM2.5, worst day of the week</text>`;
  A.bands.forEach(b=>{const yt=y(Math.min(b.hi,P1)),yb=y(Math.max(b.lo,P0)),sh=b.n?b.k/b.n:null;
    s+=`<rect x="${AX-12}" y="${yt+1}" width="24" height="${yb-yt-2}" rx="6" fill="var(--air)" opacity="${sh==null?0.05:0.12+0.75*sh}"/>`;
    s+=`<text x="${AX-20}" y="${(yt+yb)/2+4}" text-anchor="end" font-size="12" fill="${b.n?"var(--ink)":"var(--ink-3)"}">${b.n?`${R(100*b.k/b.n)}% of ${b.n} week${b.n==1?"":"s"}`:"no weeks"}</text>`});
  s+=`<line x1="${AX-60}" y1="${y(35.5)}" x2="${AX+60}" y2="${y(35.5)}" stroke="var(--epa)" stroke-width="1.5" stroke-dasharray="5 3"/><text x="${AX+64}" y="${y(35.5)-4}" font-size="11" fill="var(--epa)">EPA unhealthy for sensitive groups</text>`;
  s+=`<line x1="${AX-26}" y1="${y(v.typ_pm)}" x2="${AX+26}" y2="${y(v.typ_pm)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="3 2"/><text x="${AX+64}" y="${y(v.typ_pm)+4}" font-size="11" fill="var(--ink-2)">typical day \u00b7 ${v.typ_pm}</text>`;
  s+=`<path d="M${AX+14} ${y(v.worst_pm_week)}l8 -5v10z" fill="var(--ink-2)"/><text x="${AX+64}" y="${y(v.worst_pm_week)+4}" font-size="11" fill="var(--ink-2)">worst week \u00b7 ${v.worst_pm_week}</text>`;
  if(A.react!=null)s+=`<circle cx="${AX}" cy="${y(Math.max(A.react,P0))}" r="9" fill="var(--air)" stroke="var(--panel)" stroke-width="2"/>`;
  const others=ORDER.filter(k=>k!==city).map(k=>({k,r:G[k].air.react}));
  const L=others.map((o,i)=>({o,y:o.r!=null?y(Math.max(o.r,P0)):TOP+8+i*15}));
  spread(L,15).forEach(l=>s+=`<text x="${30}" y="${l.y+4}" font-size="11" fill="var(--ink-3)">${G[l.o.k].a} ${l.o.r!=null?"\u2265"+l.o.r:"\u2013"}</text>`);
  s+=`<text x="30" y="${TOP-12}" font-size="11" fill="var(--ink-3)">other cities' reaction point</text>`;
  const bad=A.bands.filter(b=>b.lo>=35.5),bn=bad.reduce((a,b)=>a+b.n,0),bk=bad.reduce((a,b)=>a+b.k,0);
  const read=bn?`In ${v.n}, <b>${bk} of ${bn}</b> weeks with unhealthy air (a day at or above 35.5 \u00b5g/m\u00b3) brought a spike in air purifier searches, against ${R(100*A.bands[0].k/Math.max(1,A.bands[0].n))}% of clean weeks. ${A.react!=null?`More than half of weeks spike from <b>${A.react} \u00b5g/m\u00b3</b>.`:`Searches never spiked in more than half of any band's weeks.`} <span class="muted">2022\u20132026 together; ${bn<4?"very few bad-air weeks, so read with care; ":""}a spike = searches above the city's 75th percentile${A.spike_above==0?" (here: any searches at all)":""}.</span>`:`${v.n} had no week with unhealthy air in 2022\u20132026, so there is nothing to react to. <span class="muted">Its worst week peaked at ${v.worst_pm_week} \u00b5g/m\u00b3.</span>`;
  return {svg:s,read};
}
function legend(){
  if(gauge.layer=="air")return `<span><i><svg width="14" height="14"><rect width="14" height="14" rx="4" fill="var(--air)" opacity=".7"/></svg></i>darker = more weeks with a purifier spike</span><span><i><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="var(--air)"/></svg></i>reaction point (over half of weeks spike)</span><span><i><svg width="18" height="14"><line x1="1" y1="7" x2="17" y2="7" stroke="var(--epa)" stroke-width="2" stroke-dasharray="4 2"/></svg></i>EPA line</span><span><i><svg width="18" height="14"><line x1="1" y1="7" x2="17" y2="7" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="3 2"/></svg></i>typical day 2022\u20132026</span>`;
  const c=gauge.layer=="er"?"var(--er)":gauge.layer=="ice"?"var(--ice)":"var(--heat)";
  return `<span><i><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="${c}"/></svg></i>${gauge.layer=="er"?"ER visits climb":gauge.layer=="ice"?"ice cream searches take off":"searchers reach for AC"}, with likely range</span>${gauge.layer!="er"?`<span><i><svg width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="${c}" stroke-width="2"/></svg></i>start ${gauge.layer=="ice"?"rising":"looking"}</span>`:""}${gauge.layer!="search"?`<span><i><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--heat)" stroke-width="1.5" stroke-dasharray="2 2"/></svg></i>AC searches, for comparison</span>`:""}<span><i><svg width="18" height="14"><line x1="1" y1="7" x2="17" y2="7" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="3 2"/></svg></i>typical summer high (1991\u20132020)</span><span><i><svg width="14" height="14"><circle cx="7" cy="7" r="4" fill="var(--ink-3)"/></svg></i>other cities${gauge.layer=="er"?" (* = shared HHS Region 9)":""}</span>`;
}

l summer high = June\u2013August average, 1991\u20132020. 2026 runs January to September. Associations, not causes. MDE studio project, 2026.`;
